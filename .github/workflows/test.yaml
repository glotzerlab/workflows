name: Test

on:
  pull_request:
      types: [opened, labeled, reopened, synchronize]

  workflow_dispatch:

  push:
    branches:
    - trunk

jobs:
  setup_uv_default:
    name: setup-uv [default]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
      with:
        python-version: "3.12"
    - name: Set up Python environment
      uses: ./setup-uv
    - run: uv --version

  setup_uv_version:
    name: setup-uv [version]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
      with:
        python-version: "3.12"
    - name: Set up Python environment
      uses: ./setup-uv
      with:
        version: 0.2.2
    - run: uv --version

  setup_uv_lockfile:
    name: setup-uv [only-binary=:all:]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
      with:
        python-version: "3.12"
    - name: Set up Python environment
      uses: ./setup-uv
      with:
        lockfile: .github/workflows/lockfile.txt
    - run: uv --version
    - run: python -m build --version

  setup_uv_lockfile_only_binary_none:
    name: setup-uv [only-binary=:none:]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
      with:
        python-version: "3.12"
    - name: Set up Python environment
      uses: ./setup-uv
      with:
        lockfile: .github/workflows/lockfile.txt
        only-binary: ":none:"
    - run: uv --version
    - run: python -m build --version

  setup_mdbook:
    name: setup-mdbook [default]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up mdbook
      uses: ./setup-mdbook
    - run: mdbook --version

  setup_cargo_bundle_licenses:
    name: setup-cargo-bundle-licenses [default]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up cargo-bundle-licenses
      uses: ./setup-cargo-bundle-licenses
    - run: cargo bundle-licenses --version

  update_conda_lockfiles:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'update-conda-lockfiles' && contains(github.event.pull_request.labels.*.name, 'test-conda-lockfiles') }}
    uses: ./.github/workflows/update-conda-lockfiles.yaml
    secrets: inherit
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      path: test/update-conda-lockfile

  update_uv_lockfiles:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'update-uv-lockfiles' && contains(github.event.pull_request.labels.*.name, 'test-uv-lockfiles') }}
    uses: ./.github/workflows/update-uv-lockfiles.yaml
    secrets: inherit
    with:
      branch: ${{ github.event.pull_request.head.ref }}
      path: test/update-uv-lockfile

  setup_row:
    name: setup-row [default]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
    - name: Set up row
      uses: ./setup-row
    - run: row --version
    - run: row --help

  tests_complete:
    name: All tests
    if: always()
    needs:
    - setup_uv_default
    - setup_uv_version
    - setup_uv_lockfile
    - setup_uv_lockfile_only_binary_none
    - setup_mdbook
    - setup_cargo_bundle_licenses
    - setup_row
    runs-on: ubuntu-latest

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: exit 0
